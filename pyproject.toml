[project]
name = "fairhire-ai"
version = "0.0.1"
description = "Open-source hiring funnel disparity audit (ChiEAC)"
requires-python = ">=3.11"
license = { text = "MIT" }

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
